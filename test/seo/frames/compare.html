<!doctype html>
<html><head><meta charset="utf-8">
<!-- size: 1600x900 -->
{{font_link}}
<style>{{base_css}}
.frame { padding: 72px 72px 120px; justify-content: center; }
h2 { font-size: 46px; margin-bottom: 36px; }
h2:empty { display: none; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 28px; }
th, td { padding: 22px 28px; text-align: left; vertical-align: top; }
thead th {
  font-family: var(--font-heading); font-weight: 700; font-size: 30px;
  background: var(--primary); color: var(--on-primary);
}
thead th:first-child { background: transparent; color: var(--muted); border-radius: 0; }
thead th:nth-child(2) { border-top-left-radius: var(--radius); }
thead th:last-child { border-top-right-radius: var(--radius); }
tbody td { background: var(--surface); border-bottom: 2px solid var(--bg); }
tbody td:first-child { background: transparent; font-weight: 600; color: var(--text); }
tbody tr:last-child td:nth-child(2) { border-bottom-left-radius: var(--radius); }
tbody tr:last-child td:last-child { border-bottom-right-radius: var(--radius); }
</style></head>
<body>
<div class="frame motif-{{motif}}">
  <div class="eyebrow">{{eyebrow}}</div>
  <h2>{{title}}</h2>
  <table>
    <thead><tr><th></th>{{column_cells}}</tr></thead>
    <tbody>{{row_html}}</tbody>
  </table>
  <div class="brandbar">{{logo_html}}<span>{{product}}</span></div>
</div>
</body></html>
