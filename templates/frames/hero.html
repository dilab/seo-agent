<!doctype html>
<html><head><meta charset="utf-8">
<!-- size: 1200x630 -->
{{font_link}}
<style>{{base_css}}
.frame { flex-direction: row; align-items: center; gap: 56px; padding: 72px 72px 110px; }
.text { flex: 1 1 0; min-width: 0; }
h1 { font-size: {{title_size}}px; }
.subject-slot { flex: 0 0 360px; height: 360px; }
.no-subject .text { flex-basis: 100%; }
.no-subject .subject-slot { display: none; }
.no-subject h1 { max-width: 900px; }
</style></head>
<body>
<div class="frame motif-{{motif}} {{subject_class}}">
  <div class="text">
    <div class="eyebrow">{{eyebrow}}</div>
    <h1>{{title}}</h1>
  </div>
  <div class="subject-slot">{{subject_img}}</div>
  <div class="brandbar">{{logo_html}}<span>{{product}}</span></div>
</div>
</body></html>
