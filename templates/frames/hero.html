<!doctype html>
<html><head><meta charset="utf-8">
<!-- size: 1200x630 -->
{{font_link}}
<style>{{base_css}}
.frame { padding: 72px 72px 110px; justify-content: center; }
h1 { font-size: {{title_size}}px; max-width: 1000px; }
.description { margin-top: 24px; font-size: 26px; color: var(--muted); max-width: 900px; line-height: 1.4; }
.description:empty { display: none; }
</style></head>
<body>
<div class="frame motif-{{motif}}">
  <div class="eyebrow">{{eyebrow}}</div>
  <h1>{{title}}</h1>
  <div class="description">{{description}}</div>
  <div class="brandbar">{{logo_html}}<span>{{product}}</span></div>
</div>
</body></html>
